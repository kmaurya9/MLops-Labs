name: Python Unittests

on:
  push:
    branches: [main]
    paths:
      - "Lab1/**"
      - ".github/workflows/unittest_action.yml"
  pull_request:
    branches: [main]
    paths:
      - "Lab1/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Lab1

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unittests
        run: python -m unittest -v test.test_unittest

      - name: Notify on success
        if: success()
        run: echo "Unit tests passed successfully"

      - name: Notify on failure
        if: failure()
        run: echo "Unit tests failed"
